[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-retriever"
version = "0.1.0"
description = "Retrieve your own Garmin Connect Personal API data to CSV/JSON files or a local SQLite database."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "MP4N" }]
keywords = ["garmin", "garmin-connect", "health", "fitness", "quantified-self", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
garmin-retriever = "garmin_retriever.cli:main"

[tool.setuptools]
packages = ["garmin_retriever"]
